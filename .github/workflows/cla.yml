name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) do NOT match
# this repo's prior hardcoded allowlist (adds LLEmacs), so `owner_allowlist`
# is overridden below.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    # Pass the ONE secret the callee declares, never `secrets: inherit`.
    #
    # This job is startable by an outsider (`issue_comment`,
    # `pull_request_target`), and the callee runs on a PERSISTENT SHARED
    # self-hosted runner ([self-hosted, Linux, X64, spartan-cpu]). Under
    # `secrets: inherit` every secret this repo holds -- including the
    # fleet PAT, which has nothing to do with the CLA -- was forwarded
    # into that job. Neither file showed it alone: the caller names no
    # `runs-on`, so the destination lives in the callee.
    #
    # The callee has declared `GH_PERSONAL_ACCESS_TOKEN` as an explicit
    # `workflow_call` secret precisely so callers can stop inheriting;
    # scholar was simply an un-migrated caller. Flagged by PS-224 §1.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
