name: release

# A tag grants no bypass: ordinary main promotion, exact source, native full
# matrix, source-bound artifacts and the existing PyPI environment remain gates.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing vX.Y.Z tag on protected main'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scholar-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@07d86a83e571c44ae8ba5e1dccb35299a53e9d03
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  preflight:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Require existing organization admission
        env:
          AUTHORIZED: ${{ needs.admission.outputs.native_authorized }}
        run: test "$AUTHORIZED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.9
      - name: Resolve promoted main/tag and run real archive controls
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IO_CONTEXT_PARENT="$(realpath -- "$RUNNER_TEMP")"
          SCRATCH_PREFIX="$IO_CONTEXT_PARENT/scholar-preflight-"
          source .github/ci/release-context.sh
          driver_body() {
            python -I -S -B .github/ci/release-identity.py resolve --tag "$RELEASE_TAG"
            uv venv --python "$(command -v python)" --seed "$TMPDIR/venv"
            uv pip install --python "$TMPDIR/venv/bin/python" build hatchling
            export RUNNER_TEMP="$TMPDIR"
            "$TMPDIR/venv/bin/python" -I -B .github/ci/test_release_identity.py
          }
          run_owned_body

  verify:
    needs: [admission, preflight]
    if: needs.admission.outputs.native_authorized == 'true'
    # The accepted central profile binds the qualified native image/runtime,
    # exact eight-helper closure, private PostgreSQL and fixed runner policy.
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@07d86a83e571c44ae8ba5e1dccb35299a53e9d03
    with:
      operation: test
      source_commit: ${{ needs.preflight.outputs.source_sha }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  build:
    needs: [admission, preflight, verify]
    if: needs.admission.outputs.native_authorized == 'true'
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@07d86a83e571c44ae8ba5e1dccb35299a53e9d03
    with:
      operation: build
      source_commit: ${{ needs.preflight.outputs.source_sha }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  publish:
    needs: [admission, preflight, build]
    if: needs.admission.outputs.native_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-scholar
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: scholar-dist-${{ needs.preflight.outputs.source_sha }}
          path: dist
      - name: Revalidate complete source/artifacts and tag before OIDC
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          python -I -S -B .github/ci/release-identity.py verify-proof --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --revalidate
          # The verifier requires the proof plus exactly two real distributions.
          # Keep that proof as evidence; the existing PyPI action receives only
          # the same verified wheel and source distribution, not the JSON file.
          mv dist/release-proof.json release-proof.json
      - name: Publish through the existing PyPI environment and OIDC mechanism
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: false

  release:
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: scholar-dist-${{ needs.preflight.outputs.source_sha }}
          path: dist
      - name: Revalidate release assets and extract actual version notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          python -I -S -B .github/ci/release-identity.py verify-proof --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --revalidate
          VERSION="${RELEASE_TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create release from the same verified wheel and source distribution
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
