# The full legacy SIF gate is retained below. It needs a qualified central
# Scholar caller/profile before release tagging or publication.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish (for example v1.13.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Resolve the existing release tag once
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: source
        env:
          RELEASE_TAG: ${{ inputs.version }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.eventName === 'push'
              ? context.ref.replace(/^refs\/tags\//, '') : process.env.RELEASE_TAG;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?$/.test(tag)) {
              throw new Error('Expected an existing versioned release tag');
            }
            const ref = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            let object = ref.data.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
            }
            if (object.type !== 'commit' || !/^[a-f0-9]{40}$/.test(object.sha)) {
              throw new Error('Release tag did not resolve to a commit');
            }
            if (context.eventName === 'push' && object.sha !== context.sha) {
              throw new Error('Release tag moved after the triggering event');
            }
            core.setOutput('version', tag);
            core.setOutput('source_sha', object.sha);

  verify:
    # INELIGIBLE legacy seam: preserve full driver and all three Python minors.
    # Replace only with the actual qualified shared Scholar contract; never
    # substitute the Dev/SAC profile or a reduced/direct-hosted pytest gate.
    needs: tag
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
      SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run the full legacy SIF suite for the immutable source
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}

  build:
    needs: [tag, verify]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.dist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.9
      - name: Require package metadata to match the selected release tag
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
          SOURCE_SHA: ${{ needs.tag.outputs.source_sha }}
        run: |
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'scitex-scholar' or project['version'] != os.environ['RELEASE_TAG'][1:]:
              raise SystemExit('Selected tag and project metadata disagree')
          PY
      - name: Build the selected wheel and source distribution
        run: |
          rm -rf dist
          uv build --no-sources --python 3.12
      - name: Require both distributions to contain the selected package version
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path
          files = sorted(Path('dist').iterdir())
          wheels = [p for p in files if p.name.endswith('.whl')]
          sdists = [p for p in files if p.name.endswith('.tar.gz')]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1 or any(p.is_symlink() or not p.is_file() for p in files):
              raise SystemExit('Expected one regular wheel and one regular source distribution')
          with zipfile.ZipFile(wheels[0]) as archive:
              names = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
              if len(names) != 1:
                  raise SystemExit('Ambiguous wheel metadata')
              wheel_metadata = archive.read(names[0])
          with tarfile.open(sdists[0], 'r:gz') as archive:
              members = [m for m in archive.getmembers() if m.isfile() and m.name.count('/') == 1 and m.name.endswith('/PKG-INFO')]
              if len(members) != 1:
                  raise SystemExit('Ambiguous source-distribution metadata')
              with archive.extractfile(members[0]) as stream:
                  sdist_metadata = stream.read()
          for data in (wheel_metadata, sdist_metadata):
              metadata = BytesParser().parsebytes(data)
              if metadata['Name'] != 'scitex-scholar' or metadata['Version'] != os.environ['RELEASE_TAG'][1:]:
                  raise SystemExit('Distribution metadata differs from the selected release')
          PY
      - uses: actions/upload-artifact@v4
        id: dist
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-scholar
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the selected tag to retain its verified commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
          SOURCE_SHA: ${{ needs.tag.outputs.source_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            let object = (await github.rest.git.getRef({owner, repo, ref: `tags/${process.env.RELEASE_TAG}`})).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.SOURCE_SHA) throw new Error('Verified release tag moved');
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Publish through the existing PyPI environment and OIDC mechanism
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false

  release:
    needs: [tag, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.source_sha }}
          persist-credentials: false
      - name: Require the selected tag to retain its verified commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
          SOURCE_SHA: ${{ needs.tag.outputs.source_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            let object = (await github.rest.git.getRef({owner, repo, ref: `tags/${process.env.RELEASE_TAG}`})).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              object = (await github.rest.git.getTag({owner, repo, tag_sha: object.sha})).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.SOURCE_SHA) throw new Error('Verified release tag moved');
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.version }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release from the same run's distribution artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          name: ${{ needs.tag.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
