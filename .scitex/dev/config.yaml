# scitex-dev project-type config
# Drives which rule families the auditor applies.
# See: scitex-dev ecosystem audit-project --help

project-type:
  - pip

audit:
  # Root-whitelist for files that legitimately live at repo root and would
  # otherwise trip PS-103 §1 top-level-junk-file. codecov.yml MUST be at
  # repo root for Codecov to discover it (per
  # general/02_package_11_ci-and-codecov.md).
  root-whitelist:
    files:
      - codecov.yml

  exemptions:
    # PS-224 §1 flags a job whose `runs-on` label is absent from the
    # destination registry (~/.scitex/dev/hosts.yaml), which currently
    # registers spartan self-hosted labels ONLY.
    #
    # Both jobs below target `ubuntu-latest` deliberately. Constitution §4:
    # "CI defaults to GitHub-hosted runners. Most of our repositories are
    # public, so hosted minutes are free ... Prefer the boring, managed
    # option first." A docs build is exactly that case -- short, no GPU, no
    # large data -- so re-pointing them at spartan would be the wrong fix.
    #
    # So this is a REGISTRY GAP, not a repo defect: `ubuntu-latest` is a
    # constitution-endorsed destination that no host file lists. The right
    # fix is to register it once, centrally, not to repeat this exemption in
    # every repo -- tracked as `scholar-ci-red-ps224-runner-destination`
    # (raised with scitex-dev). DELETE BOTH ENTRIES once it is registered;
    # they are scoped to these two jobs so nothing else in PS-224 is
    # silenced, and the cla.yml finding from the same rule was FIXED rather
    # than exempted.
    # PS-231 §1 flags this workflow as re-implementing the org reusable
    # `rtd-sphinx-build` instead of calling it. The finding is TRUE. The
    # prescribed remedy is not yet available, and applying it today would
    # introduce a WORSE, SILENT defect than the one being flagged.
    #
    # MEASURED (figrecipe, corroborated against scholar's own file):
    # the org reusable is BUILD-ONLY; this leaf is BUILD + PUBLISH.
    #   1. It refreshes the VENDORED docs bundle at src/scitex_scholar/
    #      _sphinx_html/ and commits it back. That bundle is NOT a build
    #      artifact -- hatch packages src/scitex_scholar wholesale, so
    #      _sphinx_html/** SHIPS INSIDE THE WHEEL. The org workflow has no
    #      contents:write, no vendor-dir, no commit-back and no artifact
    #      output, so a bare `uses:` conversion would silently FREEZE the
    #      in-wheel documentation at its current state: green CI, stale
    #      docs reaching users, nothing anywhere saying so.
    #   2. It runs `sphinx-build -W` on pull_request. The org build never
    #      passes -W and exposes no fail_on_warning / sphinx_opts input, so
    #      converting would silently WEAKEN the PR docs gate.
    #   3. It builds on Python 3.11, matching .readthedocs.yaml's
    #      build.tools.python. The org hardcodes 3.12, so after conversion
    #      CI and RTD would no longer build on the same interpreter.
    #
    # THIS IS NOT A LEAF PECULIARITY, which is why the fix is not local:
    # the same build+publish shape appears in ~30 scitex-ai repos, and ~16
    # carry a _sphinx_html bundle. THREE ORG-SIDE INPUTS RETIRE ALL OF THEM
    # AT ONCE: `fail_on_warning` (or `sphinx_opts`), `python_version`, and
    # `upload_artifact` + an artifact-name output so each caller does its
    # own vendor+commit in its own job with its own contents:write.
    # THE RETIREMENT CONDITION IS A PR NUMBER, NOT A WISH: scitex-ai/.github#41,
    # opened by figrecipe, adds exactly those inputs. An exemption whose reason
    # names a needed CHANGE is waiting on a wish; one that names a PR NUMBER is
    # waiting on a review, and only the second converges. So the review below
    # asks one answerable question -- did #41 merge? -- rather than "has anyone
    # thought about it yet". Filed alongside
    # dev-corpus-release-turned-15-repos-red-and-notified-none-of-them-20260818.
    #
    # DELETE THIS ENTRY the moment those inputs exist and the workflow is
    # converted -- exactly as the PS-224 entries below are to be deleted
    # once ubuntu-latest is registered. Reviewed on the date in
    # scholar-ps231-exemption-review; if the org inputs have not landed by
    # then, the correct action is to push scitex-dev again, NOT to quietly
    # extend this. A time-boxed exemption with no date is a permanent one
    # with optimistic wording.
    #
    # Ruling: scitex-hub, 2026-08-18. Scoped to this ONE path, so every
    # other PS-231 finding in this repo still fails the build.
    PS-231:
      - path: .github/workflows/rtd-sphinx-build-on-ubuntu-latest.yml
        line: 0
        reason: >-
          Org reusable is build-only; this leaf also vendors and commits
          back src/scitex_scholar/_sphinx_html/, which ships inside the
          wheel. Converting today would silently freeze the in-wheel docs,
          drop `sphinx-build -W`, and move CI off the Python 3.11 that
          .readthedocs.yaml pins. Blocked on org-side fail_on_warning /
          python_version / upload_artifact inputs -- remove when they land.

    #
    # WHICH ARM OF PS-224 THESE ARE, verified 2026-08-18 by reading the rule
    # SOURCE rather than its message. PS-224 has two arms and they are not
    # equally safe to exempt:
    #   arm 1  `runs-on` names a destination absent from the hosts registry
    #   arm 2  a `uses:` caller that is attacker-triggerable AND passes
    #          `secrets: inherit`, where the runner choice lives in the callee
    #          -- a real credential exposure
    # scitex-app measured that the finding TEXT describes arm 1 while arm 2 is
    # what fires, so the message prescribes a fix that cannot be written (a
    # `uses:` job may not declare `runs-on`) and then offers an exemption two
    # sentences later -- steering a conscientious reader into exempting an
    # exposure. Both entries below were checked against that:
    #   newb   : own `steps:`, not a `uses:` caller; schedule + workflow_dispatch
    #            (not attacker-triggerable); no `secrets:` key at all
    #   sphinx : own `steps:`, not a `uses:` caller; push + pull_request
    #            (NOT pull_request_target, so no elevated token on fork PRs);
    #            no `secrets:` key at all
    # Both are arm 1. Neither masks an exposure. THE DISCRIMINATOR IS CHEAP --
    # does the exempted job have its own `steps:`, or is it a `uses:` caller
    # with `secrets: inherit`? Re-run that check before trusting these entries.
    PS-224:
      - path: .github/workflows/newb-docs-quality-on-ubuntu-latest.yml::newb
        line: 0
        reason: >-
          Docs-quality job; ubuntu-latest is the constitution §4 default for
          public repos. Registry gap, not a misrouted job -- remove when
          ubuntu-latest is in hosts.yaml.
      - path: .github/workflows/rtd-sphinx-build-on-ubuntu-latest.yml::sphinx
        line: 0
        reason: >-
          Read-the-Docs sphinx build; ubuntu-latest is the constitution §4
          default for public repos. Registry gap, not a misrouted job --
          remove when ubuntu-latest is in hosts.yaml.
