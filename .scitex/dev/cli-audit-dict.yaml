# Custom CLI vocabulary for scitex-scholar.
# Words listed here are accepted by the §1d audit on top of the global
# catalog and Moby POS dictionary.

nouns:
  - bibtex
  - pdf
  # Zotero — the reference-manager application. Proper noun naming the
  # upstream tool the `library zotero` command group integrates with;
  # renaming would lose discoverability, so teach the audit the term.
  - zotero

# Transitive verbs (require an object — typically take a positional or `--key`).
transitive_verbs:
  - lookup
  - dedupe

# Verb-synonym exemptions (§1f): each entry needs an inline `# why` comment.
verb_exceptions:
  - refresh  # why: established Scholar verb (`library refresh`, `auth refresh` re-read remote/library state onto existing records); renaming to sync-* would break the documented CLI surface for no operator gain.
