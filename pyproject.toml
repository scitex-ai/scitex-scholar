[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-scholar"
version = "1.12.1"
description = "Scientific paper search, enrichment, download, and management for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scientific",
    "scholar",
    "literature",
    "bibtex",
    "pdf-download",
    "metadata",
    "research",
    "mcp",
    "mcp-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.0",
    "mcp",
    # Peer standalones replacing the previous `scitex[session]` umbrella
    # (PS-139). Imported directly from their peer module:
    #   storage/PaperIO.py, pdf_download/_cli.py, impact_factor/jcr/*  →
    #     `import scitex_session as session` for session.start/close
    #   pipelines/_single_steps.py, cli/handlers/project_handler.py    →
    #     `import scitex_io` for load/save
    # matplotlib is explicit because scitex-session enters/exits the @session
    # context with the user-supplied `plt` module; without it the demo
    # trailers in storage/ + pdf_download/ would NameError.
    "scitex-session>=0.1.5",
    "matplotlib>=3.5.0",
    "scitex-io>=0.2.0",
    "scitex-browser>=0.1.15",
    "scitex-logging>=0.1.0",
    # playwright is reached at top-level import (ScholarBrowserManager →
    # scitex_browser.debugging → playwright.async_api). Keep it as a core
    # dep so `pip install scitex-scholar` yields an importable package.
    "playwright>=1.40.0",
    # aiohttp is imported at module level in core/journal_normalizer,
    # core/open_access, core/oa_cache, and several metadata engines.
    "aiohttp>=3.8.0",
    # pymupdf is imported at module level in pdf_highlight/*.
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "bibtexparser>=1.4.0",
    "feedparser>=6.0.0",
    "httpx>=0.24.0",
    "nest-asyncio>=1.5.0",
    "pandas>=1.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
    # `scitex_dev.store` is the storage primitive for scholar's own derived
    # state (the library index and the JCR journal table). It is a CORE
    # dependency, not an extra: `storage/_library_index.py` and
    # `impact_factor/jcr/*` import it on the path a plain `pip install
    # scitex-scholar` exercises. `sql-manager` + `sqlalchemy` were the
    # previous JCR backend and are gone with it.
    "scitex-dev>=0.30.0",
    "tenacity>=8.0.0",
    "tqdm>=4.64.0",
    # ------------------------------------------------------------------
    # PS-233 (runtime-import-dependency-undeclared) — POLICY: a GUARDED
    # import must NOT be declared here.
    #
    # The first PS-233 remedy for this package declared every unguarded
    # import hard (django / scitex-app / scitex-ui / fastmcp / scitex-config
    # / scitex-dict / numpy), which made a bare `pip install scitex-scholar`
    # pull the whole Django GUI stack. That is wrong for THIS package: the
    # GUI/server stack and the MCP server are OPTIONAL capabilities, not
    # requirements of the search/enrich/download library. The remedy is a
    # guard at each import site, so those distributions are no longer
    # declared here — declaring a distribution used only under a guard is
    # itself a PS-233 error.
    #
    # Where each guarded capability's install hint points: `[all]`. There
    # are no per-feature extras (PS-225) -- the GUI/server stack, the MCP
    # server, the PDF/export/clew/watch backends are ALL optional
    # capabilities gated on `pip install scitex-scholar[all]`, so every
    # guard names that switch directly:
    #   django / scitex-app / scitex-ui / fastmcp / watchdog / openpyxl /
    #   pdfplumber / scitex-clew  ->  [all]
    #   numpy / scitex-config / scitex-dict -> named directly in the hint;
    #     they ship transitively anyway (pandas pulls numpy, scitex-dev
    #     pulls scitex-config, scitex-session pulls scitex-dict), so
    #     dropping the explicit pin costs a bare install nothing.
    # The guards are LOUD: each one raises/prints an actionable,
    # extra-naming message (or sets a sentinel the caller can test) —
    # never a silent `pass`.
]

[project.optional-dependencies]
# PS-225: per-feature extras are retired — exactly two installs exist,
# `pip install <pkg>` (core) and `pip install <pkg>[all]` (everything).
# The former browser/clew/export/mcp/pdf/server/watch groups were
# collapsed here (audit-green, 2026-09-22). `[browser]` was a pure no-op
# (playwright is a core dep); `[server]`'s aiohttp/scitex-dev lines were
# core-redundant. Surviving feature pins live FLAT in `[all]` below.
dev = [
    "scitex-dev>=0.30.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "numpy>=1.21.0",
    # Mirror all optional extras so a fresh `pip install -e .[dev]`
    # runs the full test suite without ImportError on guarded imports.
    "playwright>=1.40.0",
    "openpyxl>=3.1.0",
    "fastmcp>=2.0.0",
    "aiohttp>=3.8.0",
    "django>=4.2",
    "scitex-app>=0.11.0",  # hosts_to_allow public name (fleet single implementation)
    # The rest of the `[all]` feature stack. Its imports in src/ are GUARDED now
    # (PS-233, 2026-09-20), so a `-e .[dev]` install missing these imports
    # fine and then fails every Django test on the guard's message. They stay
    # in `[dev]` so the GUI suite RUNS rather than degrading -- and the guards
    # are deliberately NOT importorskip'd: a skip would hide a genuinely
    # broken GUI install behind a green run.
    "scitex-ui>=0.22.0",
    "watchdog>=3.0.0",
    # tests/integration/test_clew_integration.py — used (with importorskip)
    # to exercise the optional scitex-clew provenance path in storage/PaperIO.
    "scitex-clew>=0.1.0",
    # `[pdf]`-era completeness; pdfplumber is the bundled PDF text-layer
    # backend exercised by pdf_highlight/* code paths.
    "pdfplumber>=0.9.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
# PS-221 §3: every PUBLIC extra (non-underscore, not `all`) must be a
# SUBSET of `all`, so `pip install scitex-scholar[all]` is the single
# "give me everything public" switch and can never silently
# under-install. Only `dev` and `docs` remain beside `all` (PS-225) --
# CI installs `.[all,dev]` (.github/ci/run-in-sif.sh) and RTD installs
# `.[docs]` (.github/workflows/rtd-sphinx-build-caller.yml) by those
# exact names, so they are listed too, matching how scitex-dev,
# scitex-logging, and scitex-session close their own `all`. Feature pins
# (GUI, MCP, PDF, export, clew, watch) are FLAT below, not extras.
all = [
    "scitex-scholar[dev]",
    "scitex-scholar[docs]",
    "scitex-clew>=0.1.0",
    "openpyxl>=3.1.0",
    "fastmcp>=2.0.0",
    "pdfplumber>=0.9.0",
    "django>=4.2",
    # scitex-app supplies the standalone Django launcher (run_standalone)
    # and the guarded GUI lifecycle (`embed.serve_gui` / `gui_status` /
    # `gui_stop` / `gui_port_holder`) that `_cli/gui.py` delegates to.
    # 0.5.0 is the floor, not a preference: `serve_gui` gained orphan
    # reclaim under --force, and `gui_port_holder` gained the frozen
    # three-valued `PortHolder` whose `ours is None` the `gui open` code
    # branches on. Against 0.4.x those branches read a different shape.
    "scitex-app>=0.11.0",  # hosts_to_allow public name (fleet single implementation)
    # scholar.html EXTENDS `scitex_ui/standalone_shell.html` (since 1.9.0).
    # >=0.22.0 for the `.stx-app-header__slot--project-selector` guard plus
    # the earlier >=0.19.0 `<html lang>` accessibility floor (screen-reader
    # pronunciation follows `lang`, so a wrong value is read with English
    # phonetics). Scholar builds its own context and calls render_to_string
    # directly, so it depends on the TEMPLATE-level
    # `{{ shell_lang|default:'en' }}`, not on `shell_context()`'s default.
    "scitex-ui>=0.22.0",
    "watchdog>=3.0.0",
]

[project.scripts]
scitex-scholar = "scitex_scholar._cli_main:cli"

[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-scholar"
Documentation = "https://scitex-scholar.readthedocs.io"
Repository = "https://github.com/scitex-ai/scitex-scholar.git"
Issues = "https://github.com/scitex-ai/scitex-scholar/issues"

[project.entry-points."scitex_dev.docs"]
scitex-scholar = "scitex_scholar"

[project.entry-points."scitex_dev.skills"]
scitex-scholar = "scitex_scholar"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_scholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: fast CLI happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows (slow, gated by RUN_E2E=1)",
]
# THE PACKAGE UNDER TEST IS THIS CHECKOUT, NOT WHATEVER IS INSTALLED.
#
# `scitex_scholar` lives under src/, and pytest prepends only the ROOTDIR --
# which holds no importable package. Without this line a bare `pytest` fell
# through to the ambient interpreter's copy; in the agent container that is a
# REAL, non-editable wheel in /opt/venv-sac/lib/python3.12/site-packages, and
# it was TWO MINORS STALE (1.7.1 vs the tree's 1.9.0, 6 routes vs 7).
#
# Mine surfaced only because the stale copy made tests go RED. Equal-or-newer
# goes GREEN against code the branch does not contain, and an edit-only change
# leaves no tell whatsoever. CI cannot catch it -- CI installs the branch, so
# it always resolves the right code. tests/conftest.py enforces the same thing
# at session start, comparing module PATH rather than __version__.
pythonpath = ["src"]
# importlib mode avoids module-name collisions across test subdirs (e.g.
# two `test_base.py` files in different packages) without requiring
# `__init__.py` files everywhere.
addopts = "-v --tb=short --cov=scitex_scholar --cov-report=term-missing --import-mode=importlib"

[tool.coverage.run]
# Subprocess-coverage wiring (general/05_development_06_subprocess-coverage.md).
# `parallel = true` lets every child Python interpreter (test_demos.py
# `python -m`, `jupyter nbconvert --execute`, pytest-xdist) write its own
# `.coverage.<host>.<pid>` shard; `pytest-cov` runs `coverage combine` at
# session end. `concurrency = ["multiprocessing", "thread"]` covers both
# subprocess.run and threaded test paths.
parallel = true
source = ["scitex_scholar"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Project-wide pattern: files set `__FILE__ = __file__` and
# `__DIR__ = os.path.dirname(__FILE__)` between `import os` and the rest
# of the module imports, which triggers E402 spuriously.
"src/scitex_scholar/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.pyright]
include = ["src"]
# Translator files are thin bs4 wrappers tested at integration level; strict
# type-checking produces noise without catching real bugs.
exclude = [
    "**/__pycache__",
    # Translator files are thin bs4 wrappers; integration-tested.
    "src/scitex_scholar/url_finder/translators/_individual",
    # Bundled skill scripts live under src/ for distribution but are
    # not part of the library's type surface.
    "src/scitex_scholar/.claude",
    "src/scitex_scholar/docs",
    # Hidden backup/experimental directories (not part of the package surface).
    "**/.combined-*",
]
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = false
# Silence categories dominated by false positives in this codebase:
# - scitex-logging adds .success() to stdlib Logger (pyright can't see it)
# - bs4 / mcp / pydantic-derived types return structural Unions pyright rejects
# - mixin classes rely on host-class attributes pyright can't infer
# - `param: str = None` pattern is idiomatic here and not treated as a bug
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
reportOptionalCall = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"

[tool.scitex_dev]
# §6 (MCP-parity) opt-out. scitex-scholar is a service/workflow package: its
# real interface is the Scholar/Papers classes plus stateful MCP workflow
# tools (authenticate, search_papers, download_pdf, jobs, ...). The public
# Python functions in __all__ (to_bibtex, to_ris, apply_filters,
# clean_abstract, citation-graph helpers) are auxiliary pure-data helpers,
# not a flat operation set meant to mirror the tool surface 1:1. The two
# surfaces are different *kinds* of thing by design, so the API<->MCP-tool
# parity heuristic is a false positive here (same pattern as figrecipe).
mcp_parity_exempt = true

# §6a env-var allowlist. EXACT names only -- deliberately not the `ZOTERO_`
# and `MENDELEY_` prefixes, so a NEW unprefixed variable in either
# integration still gets flagged. Each entry below is a name the VENDOR
# publishes and users already have exported; prefixing it to
# SCITEX_SCHOLAR_ZOTERO_API_KEY would break every working install to satisfy
# a linter, and would make the name LESS true rather than more: a Zotero API
# key is a Zotero API key, and the constitution's rule is that a vendor token
# in a name is correct when the thing really is vendor-specific.
#
# Scholar's OWN variables are NOT allowlisted -- they were renamed to
# SCITEX_SCHOLAR_* in this same change, with the pre-convention spellings
# still honoured behind a loud deprecation warning
# (src/scitex_scholar/_utils/_env.py).
env_allowlist = [
  # --- Vendor-published names. PERMANENT. -------------------------------
  "ZOTERO_API_KEY",
  "ZOTERO_LIBRARY_ID",
  "MENDELEY_APP_ID",
  "MENDELEY_APP_SECRET",
  "MENDELEY_ACCESS_TOKEN",

  # --- Deprecation window. TEMPORARY -- DELETE WITH THE FALLBACKS. ------
  # These five are scholar's OWN variables and they have ALREADY been
  # renamed to SCITEX_SCHOLAR_*. They appear here only because the old
  # spelling survives as a `legacy=` argument in the source, so §6a still
  # sees the string. Removing these entries without removing the matching
  # `legacy=` arguments in _utils/_env.py's callers would silently drop
  # back-compat, so the two must go together.
  #
  # Why a window at all, rather than a hard rename:
  #   SEMANTIC_SCHOLAR_API_KEY  users who read the CODE set this; the docs
  #                             always said the prefixed name, so this is
  #                             the spelling that actually worked
  #   CROSSREF_DB_PATH          same shape; docs said SCITEX_SCHOLAR_CROSSREF_DB
  #   CROSSREF_LOCAL_API_URL    was undocumented entirely until this change
  #   UNIMELB_SSO_USERNAME      institutional login credentials that are
  #   UNIMELB_SSO_PASSWORD      plausibly already exported in an operator
  #                             shell profile -- breaking these silently
  #                             would break a human's login, not a test
  #
  # Removal is tracked as scholar-env-legacy-fallback-removal. Until then
  # the fallback is LOUD: using a legacy name logs a warning naming both
  # spellings, so nobody is relying on it unknowingly.
  "SEMANTIC_SCHOLAR_API_KEY",
  "CROSSREF_DB_PATH",
  "CROSSREF_LOCAL_API_URL",
  "UNIMELB_SSO_USERNAME",
  "UNIMELB_SSO_PASSWORD",
]
